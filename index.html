          )}

          {/* Sign-in log modal */}
          {logOpen && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-[2px]" onClick={() => setLogOpen(false)} />
              <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[85vh] flex flex-col border border-teal-100">
                <div className="p-5 border-b border-slate-100 flex items-start justify-between shrink-0">
                  <div>
                    <h2 className="text-lg font-semibold text-slate-900">Sign-in log</h2>
                    <p className="text-sm text-slate-500">Every registration and sign-in, newest first (IST).</p>
                  </div>
                  <button type="button" onClick={() => setLogOpen(false)} className="text-slate-400 hover:text-slate-700 text-lg leading-none">×</button>
                </div>
                <div className="p-5 overflow-y-auto">
                  <div className="grid grid-cols-3 gap-3 mb-4">
                    {[
                      {l:'TOTAL EVENTS', v: String(log.length)},
                      {l:'UNIQUE USERS', v: String(uniqueUsers)},
                      {l:'TODAY', v: String(todayCount)},
                    ].map((k,i) => (
                      <div key={i} className="border border-slate-200 rounded-xl px-4 py-3 text-center">
                        <div className="text-[10px] uppercase tracking-wide text-slate-500 font-medium">{k.l}</div>
                        <div className="text-2xl font-bold mt-0.5">{k.v}</div>
                      </div>
                    ))}
                  </div>
                  <div className="flex flex-wrap gap-2 mb-4 items-center">
                    <div className="relative flex-1 min-w-[180px]">
                      <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
                      <input type="text" value={search} onChange={e => setSearch(e.target.value)}
                        placeholder="Search email, name or event"
                        className="w-full border border-slate-200 rounded-full pl-9 pr-3 py-2 text-sm" />
                    </div>
                    <button type="button" onClick={exportCsv}
                      className="border border-slate-200 rounded-full px-3 py-2 text-sm hover:bg-slate-50">↓ Export CSV</button>
                    <button type="button" onClick={() => { setChangePwOpen(true); setError(''); }}
                      className="border border-slate-200 rounded-full px-3 py-2 text-sm hover:bg-slate-50">Change password</button>
                  </div>
                  {changePwOpen && (
                    <form onSubmit={doChangePw} className="mb-4 p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-wrap gap-2 items-end">
                      <div>
                        <label className="text-xs text-slate-500">New password</label>
                        <input type="password" value={newPw} onChange={e => setNewPw(e.target.value)} className="block border border-slate-200 rounded-lg px-2 py-1.5 text-sm" />
                      </div>
                      <div>
                        <label className="text-xs text-slate-500">Confirm</label>
                        <input type="password" value={newPw2} onChange={e => setNewPw2(e.target.value)} className="block border border-slate-200 rounded-lg px-2 py-1.5 text-sm" />
                      </div>
                      <button type="submit" className="bg-teal-600 text-white text-sm px-3 py-1.5 rounded-lg">Save</button>
                      <button type="button" onClick={() => setChangePwOpen(false)} className="text-sm text-slate-500 px-2">Cancel</button>
                      {error && <p className="text-xs text-rose-600 w-full">{error}</p>}
                    </form>
                  )}
                  <div className="border border-slate-200 rounded-xl overflow-hidden">
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="bg-slate-50 text-slate-500 text-left">
                          <th className="py-2.5 px-3 font-medium">Date</th>
                          <th className="py-2.5 px-3 font-medium">Time</th>
                          <th className="py-2.5 px-3 font-medium">Email</th>
                          <th className="py-2.5 px-3 font-medium">Name</th>
                          <th className="py-2.5 px-3 font-medium">Event</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filtered.length === 0 && (
                          <tr><td colSpan="5" className="py-6 text-center text-slate-400">No sign-in events yet</td></tr>
                        )}
                        {filtered.map(r => (
                          <tr key={r.id} className="hover:bg-slate-50">
                            <td className="py-2.5 px-3 whitespace-nowrap">{r.date}</td>
                            <td className="py-2.5 px-3 whitespace-nowrap">{r.time}</td>
                            <td className="py-2.5 px-3">{r.email}</td>
                            <td className="py-2.5 px-3">{r.name}</td>
                            <td className="py-2.5 px-3">
                              <span className={`text-xs px-2 py-0.5 rounded-full font-medium border
                                ${r.event === 'Registered' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                  r.event === 'Signed in' ? 'bg-sky-50 text-sky-700 border-sky-200' :
                                  'bg-slate-50 text-slate-600 border-slate-200'}`}>
                                {r.event}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    // ========== LOGIN / LANDING PAGE ==========
    function LoginPage({ onEnter }) {
      const [mode, setMode] = useState('landing'); // landing | email | register
      const [email, setEmail] = useState('');
      const [name, setName] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const finish = (info) => {
        logSignInEvent(info);
        try {
          localStorage.setItem('ciq_session', JSON.stringify({
            email: info.email, name: info.name, at: Date.now()
          }));
        } catch (e) {}
        onEnter(info);
      };

      const handleOAuth = (provider) => {
        const samples = {
          google: { email: 'user.google@gmail.com', name: 'Google User', event: 'Signed in' },
          microsoft: { email: 'user@outlook.com', name: 'Microsoft User', event: 'Signed in' },
          default: { email: 'guest@compensationiq.app', name: 'Guest user', event: 'Signed in' },
        };
        finish(samples[provider] || samples.default);
      };

      const handleEmailSubmit = (e) => {
        e.preventDefault();
        setError('');
        const em = email.trim();
        const nm = (name.trim() || em.split('@')[0] || 'Visitor');
        if (!em || !em.includes('@')) {
          setError('Enter a valid work email');
          return;
        }
        if (!password || password.length < 4) {
          setError('Password must be at least 4 characters');
          return;
        }
        setBusy(true);
        finish({
          email: em,
          name: nm,
          event: mode === 'register' ? 'Registered' : 'Signed in',
        });
        setBusy(false);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-white relative overflow-hidden" style={{
          backgroundImage: 'linear-gradient(135deg, #0a1628 0%, #0f172a 40%, #0c4a6e 100%)',
        }}>
          {/* grid overlay */}
          <div className="absolute inset-0 opacity-[0.07]" style={{
            backgroundImage: 'linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px)',
            backgroundSize: '48px 48px',
          }} />
          {/* soft glow */}
          <div className="absolute -top-32 -right-32 w-96 h-96 bg-teal-500/20 rounded-full blur-3xl pointer-events-none" />
          <div className="absolute bottom-0 left-1/4 w-72 h-72 bg-sky-600/10 rounded-full blur-3xl pointer-events-none" />

          {/* top bar */}
          <header className="relative z-10 flex items-center justify-between px-6 sm:px-8 py-5">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-full bg-teal-500 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-teal-500/30">CI</div>
              <span className="font-semibold text-sm tracking-wide">Compensation IQ</span>
            </div>
            <button type="button" onClick={() => { setMode('email'); setError(''); }}
              className="text-sm text-slate-300 hover:text-white transition">Sign in</button>
          </header>

          <div className="relative z-10 max-w-6xl mx-auto px-6 sm:px-8 pt-8 pb-20 flex flex-col lg:flex-row gap-12 items-center lg:items-start">
            {/* left hero */}
            <div className="flex-1 pt-2">
              <div className="inline-flex items-center gap-1.5 text-xs bg-slate-800/80 border border-slate-700 text-slate-300 rounded-full px-3 py-1 mb-6">
                <span className="text-teal-400">◈</span> 2026 planning model · {TOTAL_MODELLED}+ countries
              </div>
              <h1 className="text-4xl sm:text-5xl lg:text-6xl font-bold leading-[1.1] mb-5">
                Global<br />
                Compensation<br />
                <span className="text-sky-400">Intelligence</span>
              </h1>
              <p className="text-slate-400 text-base max-w-md mb-8 leading-relaxed">
                Turn any salary into the full payroll picture — employer cost, statutory contributions, income tax and take-home — with the labour-law context around it.
              </p>
              <button
                type="button"
                onClick={() => { setMode('email'); setError(''); }}
                className="inline-flex items-center gap-2 bg-teal-500 hover:bg-teal-400 text-white font-medium px-6 py-3 rounded-full transition shadow-lg shadow-teal-500/25"
              >
                Get started <span>→</span>
              </button>
              <div className="flex gap-8 sm:gap-10 mt-12">
                {[
                  {v: String(TOTAL_MODELLED) + '+', l: 'countries'},
                  {v: '9', l: 'intelligence modules'},
                  {v: '2026', l: 'statutory model'},
                ].map((s, i) => (
                  <div key={i}>
                    <div className="text-2xl font-bold">{s.v}</div>
                    <div className="text-xs text-slate-500 mt-0.5">{s.l}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* right – auth card */}
            <div className="w-full max-w-sm shrink-0">
              <div className="bg-slate-900/80 backdrop-blur border border-slate-700/80 rounded-2xl p-6 shadow-2xl">
                {mode === 'landing' && (
                  <>
                    <h2 className="text-lg font-semibold mb-1">Sign in to continue</h2>
                    <p className="text-sm text-slate-400 mb-5">Use your work email or Google account.</p>

                    <button
                      type="button"
                      onClick={() => handleOAuth('google')}
                      className="w-full flex items-center justify-center gap-2 bg-white text-slate-900 font-medium rounded-full py-2.5 text-sm hover:bg-slate-100 transition mb-3"
                    >
                      <svg className="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                      </svg>
                      Continue with Google
                    </button>

                    <div className="flex gap-2 mb-3">
                      {[
                        { label: 'M', tip: 'Microsoft', provider: 'microsoft' },
                        { label: 'Y', tip: 'Yahoo', provider: 'default' },
                        { label: 'in', tip: 'LinkedIn', provider: 'default' },
                        { label: '⌘', tip: 'GitHub', provider: 'default' },
                      ].map((item, i) => (
                        <button
                          key={i}
                          type="button"
                          title={item.tip}
                          onClick={() => handleOAuth(item.provider)}
                          className="flex-1 h-10 rounded-full bg-slate-800 border border-slate-700 hover:bg-slate-700 flex items-center justify-center text-xs font-medium transition"
                        >
                          {item.label}
                        </button>
                      ))}
                    </div>

                    <button
                      type="button"
                      onClick={() => { setMode('email'); setError(''); }}
                      className="w-full flex items-center justify-center gap-2 border border-slate-600 text-slate-200 font-medium rounded-full py-2.5 text-sm hover:bg-slate-800 transition mb-4"
                    >
                      ✉ Continue with email
                    </button>

                    <p className="text-[11px] text-slate-500 text-center mb-5">
                      Microsoft, Yahoo, LinkedIn and GitHub users sign in with their account email.
                    </p>

                    <div className="border-t border-slate-700 pt-4 space-y-3">
                      {[
                        { icon: '▤', title: 'Gross-to-net calculator', desc: 'CTC, statutory contributions, tax and take-home in seconds.' },
                        { icon: '▥', title: 'Pay bands & benchmarks', desc: 'Median, min and max by role and level across markets.' },
                        { icon: '🏛', title: 'Tax & statutory', desc: 'Employer load, social security and labour-law context.' },
                      ].map((f, i) => (
                        <div key={i} className="flex gap-3 items-start">
                          <div className="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-sm shrink-0">{f.icon}</div>
                          <div>
                            <div className="text-sm font-medium text-slate-200">{f.title}</div>
                            <div className="text-[11px] text-slate-500 leading-snug">{f.desc}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>
                )}

                {(mode === 'email' || mode === 'register') && (
                  <>
                    <h2 className="text-lg font-semibold mb-1">
                      {mode === 'register' ? 'Create account' : 'Sign in with email'}
                    </h2>
                    <p className="text-sm text-slate-400 mb-4">
                      Enter your details to access Compensation IQ.
                    </p>
                    <form onSubmit={handleEmailSubmit} className="space-y-3">
                      <div>
                        <label className="text-xs text-slate-400">Full name</label>
                        <input
                          type="text"
                          value={name}
                          onChange={e => setName(e.target.value)}
                          className="mt-1 w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500"
                          placeholder="Your name"
                          autoComplete="name"
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400">Work email</label>
                        <input
                          type="email"
                          value={email}
                          onChange={e => setEmail(e.target.value)}
                          className="mt-1 w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500"
                          placeholder="you@company.com"
                          required
                          autoComplete="email"
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400">Password</label>
                        <input
                          type="password"
                          value={password}
                          onChange={e => setPassword(e.target.value)}
                          className="mt-1 w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500"
                          placeholder="Min. 4 characters"
                          required
                          autoComplete="current-password"
                        />
                      </div>
                      {error && <p className="text-xs text-rose-400">{error}</p>}
                      <button
                        type="submit"
                        disabled={busy}
                        className="w-full bg-teal-500 hover:bg-teal-400 disabled:opacity-60 text-white font-medium rounded-full py-2.5 text-sm transition shadow-lg shadow-teal-500/20"
                      >
                        {busy ? 'Please wait…' : (mode === 'register' ? 'Register' : 'Sign in')}
                      </button>
                    </form>
                    <div className="mt-4 flex justify-between text-xs text-slate-500">
                      <button
                        type="button"
                        className="hover:text-slate-300"
                        onClick={() => setMode(mode === 'register' ? 'email' : 'register')}
                      >
                        {mode === 'register' ? 'Have an account? Sign in' : 'New here? Register'}
                      </button>
                      <button type="button" className="hover:text-slate-300" onClick={() => setMode('landing')}>
                        Back
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          </div>

          <footer className="relative z-10 px-6 sm:px-8 pb-6 flex flex-wrap justify-between text-[11px] text-slate-600 gap-2">
            <span>© 2026 Global Compensation Intelligence · Created by Neeraj Kapil</span>
            <span>Planning estimates, not payroll or legal advice.</span>
          </footer>
        </div>
      );
    }

    // ========== ROOT APP ==========
    function App() {
      const demoParams = (() => {
        try {
          const q = new URLSearchParams(window.location.search);
          return {
            demo: q.get('demo') === '1',
            page: q.get('page') || 'dashboard',
            region: q.get('region') || 'World',
            focus: q.get('focus') || 'India',
          };
        } catch (e) { return { demo: false, page: 'dashboard', region: 'World', focus: 'India' }; }
      })();
      const [loggedIn, setLoggedIn] = useState(() => {
        if (demoParams.demo) return true;
        try { return !!localStorage.getItem('ciq_session'); } catch (e) { return false; }
      });
      const [user, setUser] = useState(() => {
        if (demoParams.demo) return { email: 'demo@client.com', name: 'Client Demo' };
        try { return JSON.parse(localStorage.getItem('ciq_session') || 'null'); } catch (e) { return null; }
      });
      const [page, setPage] = useState(demoParams.demo ? demoParams.page : 'dashboard');
      const [collapsed, setCollapsed] = useState(false);
      const [region, setRegion] = useState(demoParams.demo ? demoParams.region : 'World');
      const [focusMarket, setFocusMarket] = useState(demoParams.demo ? demoParams.focus : 'India');
      const [funcs, setFuncs] = useState([]);
      const [levels, setLevels] = useState([]);
      const titles = {dashboard:'Dashboard',calculator:'Calculator',engagement:'Engagement',compare:'Compare',bands:'Pay bands',benefits:'Leave & benefits',tax:'Tax & statutory',wages:'Min & max wages',coverage:'Coverage'};
      const filterProps = { region, setRegion, focusMarket, setFocusMarket, funcs, setFuncs, levels, setLevels };

      if (!loggedIn) {
        return (
          <>
            <LoginPage onEnter={(info) => { setLoggedIn(true); setUser(info || null); }} />
            <AdminPanel />
          </>
        );
      }

      return (
        <div className="min-h-screen">
          <Sidebar active={page} setActive={setPage} collapsed={collapsed} setCollapsed={setCollapsed} />
          <main className={`transition-all duration-200 ${collapsed?'ml-16':'ml-56'}`}>
            <header className="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200 px-6 py-3 flex items-center justify-between">
              <div className="text-sm font-medium text-slate-600">{titles[page]}</div>
              <div className="flex items-center gap-3">
                <span className="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full">2026 planning model</span>
                <span className="text-xs bg-teal-50 text-teal-700 border border-teal-100 px-3 py-1 rounded-full">
                  {(ALL_COUNTRIES.find(c => c.name === focusMarket) || {}).flag || ''} {focusMarket}
                </span>
                {user && user.email && (
                  <span className="text-xs text-slate-500 hidden sm:inline max-w-[140px] truncate" title={user.email}>{user.name || user.email}</span>
                )}
                <button
                  onClick={() => { try { localStorage.removeItem('ciq_session'); } catch (e) {} setLoggedIn(false); setUser(null); }}
                  className="text-xs text-slate-500 hover:text-slate-800 border border-slate-200 rounded-full px-3 py-1"
                >
                  Sign out
                </button>
              </div>
            </header>
            <div className="p-6">
              {page==='dashboard' && <Dashboard {...filterProps} />}
              {page==='calculator' && <Calculator {...filterProps} />}
              {page==='engagement' && <Engagement {...filterProps} />}
              {page==='compare' && <Compare {...filterProps} />}
              {page==='bands' && <PayBands {...filterProps} />}
              {page==='benefits' && <Benefits {...filterProps} />}
              {page==='tax' && <TaxStatutory {...filterProps} />}
              {page==='wages' && <MinMaxWages {...filterProps} />}
              {page==='coverage' && <Coverage {...filterProps} />}
            </div>
          </main>
          <AdminPanel />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
