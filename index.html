    // ========== PAY PROGRESSION CHART (smooth area + median line) ==========
    function PayProgressionChart() {
      const [hover, setHover] = useState(null);
      // Data matching the style in the user's screenshot (USD, India)
      const data = [
        { l: 'Junior',       min: 5500,  med: 8200,  max: 12500 },
        { l: 'Professional', min: 9926,  med: 14972, max: 21730 },
        { l: 'Senior',       min: 22000, med: 32000, max: 48000 },
        { l: 'Manager',      min: 35000, med: 48000, max: 72000 },
        { l: 'Director',     min: 55000, med: 78000, max: 120000 },
        { l: 'Executive',    min: 85000, med: 115000, max: 160000 },
      ];
      const W = 320, H = 180, padL = 36, padR = 12, padT = 12, padB = 28;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const yMax = 160000;
      const x = (i) => padL + (i / (data.length - 1)) * plotW;
      const y = (v) => padT + plotH - (v / yMax) * plotH;
      // Smooth-ish path using quadratic midpoints
      const linePath = (key) => {
        let d = `M ${x(0)} ${y(data[0][key])}`;
        for (let i = 0; i < data.length - 1; i++) {
          const x0 = x(i), y0 = y(data[i][key]);
          const x1 = x(i + 1), y1 = y(data[i + 1][key]);
          const mx = (x0 + x1) / 2;
          d += ` Q ${x0 + (mx - x0) * 0.5} ${y0} ${mx} ${(y0 + y1) / 2}`;
          d += ` Q ${x1 - (x1 - mx) * 0.5} ${y1} ${x1} ${y1}`;
        }
        return d;
      };
      // Band area: max path then reverse min path
      const bandPath = () => {
        let d = `M ${x(0)} ${y(data[0].max)}`;
        for (let i = 0; i < data.length - 1; i++) {
          const x0 = x(i), y0 = y(data[i].max);
          const x1 = x(i + 1), y1 = y(data[i + 1].max);
          const mx = (x0 + x1) / 2;
          d += ` Q ${x0 + (mx - x0) * 0.5} ${y0} ${mx} ${(y0 + y1) / 2}`;
          d += ` Q ${x1 - (x1 - mx) * 0.5} ${y1} ${x1} ${y1}`;
        }
        // reverse along min
        for (let i = data.length - 1; i > 0; i--) {
          const x0 = x(i), y0 = y(data[i].min);
          const x1 = x(i - 1), y1 = y(data[i - 1].min);
          const mx = (x0 + x1) / 2;
          d += ` L ${x0} ${y0}`;
          d += ` Q ${x0 + (mx - x0) * 0.5} ${y0} ${mx} ${(y0 + y1) / 2}`;
          d += ` Q ${x1 - (x1 - mx) * 0.5} ${y1} ${x1} ${y1}`;
        }
        d += ' Z';
        return d;
      };
      const fmt = (v) => '$' + v.toLocaleString('en-US');
      return (
        <div className="relative" style={{ width: '100%', maxWidth: 360 }}>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" onMouseLeave={() => setHover(null)}>
            {/* grid lines */}
            {[0, 40, 80, 120, 160].map((v) => (
              <g key={v}>
                <line x1={padL} y1={y(v * 1000)} x2={W - padR} y2={y(v * 1000)} stroke="#e2e8f0" strokeDasharray="3 3" />
                <text x={padL - 6} y={y(v * 1000) + 3} textAnchor="end" fontSize="9" fill="#94a3b8">${v}k</text>
              </g>
            ))}
            {/* min-max band */}
            <path d={bandPath()} fill="#a7f3d0" fillOpacity="0.45" />
            {/* median line */}
            <path d={linePath('med')} fill="none" stroke="#059669" strokeWidth="2.5" strokeLinecap="round" />
            {/* points + hover targets */}
            {data.map((d, i) => (
              <g key={i}>
                <circle
                  cx={x(i)} cy={y(d.med)} r={hover === i ? 5 : 3.5}
                  fill="#fff" stroke="#059669" strokeWidth="2"
                  style={{ cursor: 'pointer' }}
                  onMouseEnter={() => setHover(i)}
                />
                {/* larger invisible hit area */}
                <circle
                  cx={x(i)} cy={y(d.med)} r={14}
                  fill="transparent"
                  style={{ cursor: 'pointer' }}
                  onMouseEnter={() => setHover(i)}
                />
                <text x={x(i)} y={H - 8} textAnchor="middle" fontSize="9" fill="#64748b">{d.l}</text>
              </g>
            ))}
            {/* vertical guide when hovering */}
            {hover !== null && (
              <line x1={x(hover)} y1={padT} x2={x(hover)} y2={padT + plotH} stroke="#94a3b8" strokeDasharray="3 3" />
            )}
          </svg>
          {/* tooltip */}
          {hover !== null && (
            <div
              className="absolute bg-white border border-slate-200 rounded-lg shadow-lg px-3 py-2 text-xs pointer-events-none z-10"
              style={{
                left: `${(x(hover) / W) * 100}%`,
                top: 20,
                transform: 'translateX(-50%)',
                minWidth: 120,
              }}
            >
              <div className="font-semibold text-slate-800 mb-1">{data[hover].l}</div>
              <div className="text-slate-400">max : {fmt(data[hover].max)}</div>
              <div className="text-emerald-600 font-medium">Median : {fmt(data[hover].med)}</div>
              <div className="text-slate-400">min : {fmt(data[hover].min)}</div>
            </div>
          )}
        </div>
      );
    }

                    <div className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 bg-white border border-slate-200 rounded-lg shadow-lg px-3 py-2 text-xs z-20 whitespace-nowrap pointer-events-none">
                      <div className="font-semibold text-slate-800 mb-1">{m.flag || ''} {m.name || m.code}</div>

            <span className="flex items-center gap-1"><span className="w-3 h-3 bg-emerald-500 rounded-sm"></span> Take-home</span>

    // ========== COST BREAKDOWN CHART (stacked + tooltip) ==========
    function CostBreakdownChart({ markets, regionLabel }) {
      const [hover, setHover] = useState(null);
      const byCode = Object.fromEntries(COST_BREAK.map(d => [d.c, d]));
      const src = markets && markets.length ? markets : MARKETS;
      const rows = src.slice(0, 14).map(m => {
        if (byCode[m.code]) return byCode[m.code];
        const load = EMPLOYER_LOAD_BY_CODE[m.code] || 12;
        const th = Math.max(50, 100 - load - 15);
        const tx = Math.min(25, 100 - th - load);
        const es = Math.max(0, 100 - th - tx - load);
        return { c: m.code, th, tx, es, ec: load };
      });
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 mb-4 relative">
          <h3 className="font-semibold">Where each unit of employer cost goes</h3>
          <p className="text-xs text-slate-500 mb-4">% of CTC at the market median · {regionLabel || 'World'} · {rows.length} markets</p>
          <div className="relative">
            {/* Y-axis labels */}
            <div className="absolute left-0 top-0 bottom-6 w-8 flex flex-col justify-between text-[10px] text-slate-400 pointer-events-none">
              <span>120%</span><span>90%</span><span>60%</span><span>30%</span><span>0%</span>
            </div>
            <div className="ml-8 flex items-end gap-1 h-52 border-l border-b border-slate-200 pl-1 relative">
              {/* horizontal grid */}
              {[0.25,0.5,0.75,1].map((f,i)=>(
                <div key={i} className="absolute left-0 right-0 border-t border-dashed border-slate-100" style={{bottom:`${f*100}%`}} />
              ))}
              {rows.map((d,i)=>{
                const total = d.th + d.tx + d.es + d.ec;
                // scale so 100% of data ≈ ~83% of chart height (matches 120% axis)
                const scale = 100 / 120;
                return (
                  <div
                    key={i}
                    className="flex-1 flex flex-col items-center h-full justify-end relative cursor-pointer group"
                    onMouseEnter={() => setHover(i)}
                    onMouseLeave={() => setHover(null)}
                  >
                    <div className="w-full flex flex-col-reverse rounded-t overflow-hidden transition-opacity" style={{height:`${total * scale}%`, opacity: hover===null||hover===i ? 1 : 0.45}}>
                      <div className="bg-emerald-500 w-full" style={{height:`${(d.th/total)*100}%`}} />
                      <div className="bg-amber-500 w-full" style={{height:`${(d.tx/total)*100}%`}} />
                      <div className="bg-blue-500 w-full" style={{height:`${(d.es/total)*100}%`}} />
                      <div className="bg-slate-800 w-full" style={{height:`${(d.ec/total)*100}%`}} />
                    </div>
                    <span className="text-[9px] text-slate-500 mt-1.5">{d.c}</span>
                    {/* tooltip */}
                    {hover === i && (
                      <div className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 bg-white border border-slate-200 rounded-lg shadow-lg px-3 py-2 text-xs z-20 whitespace-nowrap pointer-events-none">
                        <div className="font-semibold text-slate-800 mb-1.5">{d.c}</div>
                        <div className="text-emerald-600">Take-home : {d.th.toFixed(1)}%</div>
                        <div className="text-amber-500">Tax : {d.tx.toFixed(1)}%</div>
                        <div className="text-blue-500">Employee social : {d.es.toFixed(1)}%</div>
                        <div className="text-slate-700">Employer cost : {d.ec.toFixed(1)}%</div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="flex flex-wrap gap-4 mt-3 text-xs text-slate-600 ml-8">
            <span className="flex items-center gap-1"><span className="w-3 h-3 bg-emerald-500 rounded-sm"></span> Take-home</span>
            <span className="flex items-center gap-1"><span className="w-3 h-3 bg-amber-500 rounded-sm"></span> Tax</span>
            <span className="flex items-center gap-1"><span className="w-3 h-3 bg-blue-500 rounded-sm"></span> Employee social</span>
            <span className="flex items-center gap-1"><span className="w-3 h-3 bg-slate-800 rounded-sm"></span> Employer cost</span>
          </div>
        </div>
      );
    }

    // ========== PAY RANGE BY MARKET CHART ==========
    function PayRangeChart({ markets }) {
      const [hover, setHover] = useState(null);
      const src = markets && markets.length ? markets : MARKETS;
      const data = src.slice(0, 12).map(m => ({
        m: m.code,
        min: Math.round(m.ctc * 0.72 / 1000),
        med: Math.round(m.ctc / 1000),
        max: Math.round(m.ctc * 1.35 / 1000),
      }));
      const W = 340, H = 190, padL = 36, padR = 10, padT = 10, padB = 26;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const yMax = Math.max(...data.map(d => d.max), 1);
      const n = data.length;
      const slot = plotW / n;
      const barW = Math.min(22, slot * 0.55);
      const xCenter = (i) => padL + slot * i + slot / 2;
      const y = (v) => padT + plotH - (v / yMax) * plotH;
      const fmt = (v) => '$' + Math.round(v * 1000).toLocaleString('en-US');
      // median line path
      let medPath = `M ${xCenter(0)} ${y(data[0].med)}`;
      for (let i = 1; i < n; i++) medPath += ` L ${xCenter(i)} ${y(data[i].med)}`;
      return (
        <div className="relative" style={{ width: '100%', maxWidth: 380 }}>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" onMouseLeave={() => setHover(null)}>
            {/* grid */}
            {[0, 95, 190, 285, 380].map((v) => (
              <g key={v}>
                <line x1={padL} y1={y(v)} x2={W - padR} y2={y(v)} stroke="#e2e8f0" strokeDasharray="3 3" />
                <text x={padL - 5} y={y(v) + 3} textAnchor="end" fontSize="9" fill="#94a3b8">${v}k</text>
              </g>
            ))}
            {/* range bars (min-max boxes) */}
            {data.map((d, i) => {
              const top = y(d.max);
              const bot = y(d.min);
              const h = bot - top;
              return (
                <g key={i}>
                  <rect
                    x={xCenter(i) - barW / 2}
                    y={top}
                    width={barW}
                    height={Math.max(h, 2)}
                    rx="3"
                    fill="#93c5fd"
                    fillOpacity={hover === i ? 0.95 : 0.75}
                    style={{ cursor: 'pointer' }}
                    onMouseEnter={() => setHover(i)}
                  />
                  {/* invisible wider hit area */}
                  <rect
                    x={xCenter(i) - slot / 2}
                    y={padT}
                    width={slot}
                    height={plotH}
                    fill="transparent"
                    style={{ cursor: 'pointer' }}
                    onMouseEnter={() => setHover(i)}
                  />
                </g>
              );
            })}
            {/* median connecting line */}
            <path d={medPath} fill="none" stroke="#1e293b" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" />
            {/* median dots */}
            {data.map((d, i) => (
              <circle
                key={i}
                cx={xCenter(i)}
                cy={y(d.med)}
                r={hover === i ? 4.5 : 3.5}
                fill="#fff"
                stroke="#1e293b"
                strokeWidth="1.75"
                style={{ cursor: 'pointer' }}
                onMouseEnter={() => setHover(i)}
              />
            ))}
            {/* country labels */}
            {data.map((d, i) => (
              <text key={i} x={xCenter(i)} y={H - 6} textAnchor="middle" fontSize="9" fill="#64748b">{d.m}</text>
            ))}
            {/* vertical guide */}
            {hover !== null && (
              <line x1={xCenter(hover)} y1={padT} x2={xCenter(hover)} y2={padT + plotH} stroke="#94a3b8" strokeDasharray="3 3" />
            )}
          </svg>
          {hover !== null && (
            <div
              className="absolute bg-white border border-slate-200 rounded-lg shadow-lg px-3 py-2 text-xs pointer-events-none z-10"
              style={{
                left: `${(xCenter(hover) / W) * 100}%`,
                top: 16,
                transform: 'translateX(-50%)',
                minWidth: 110,
              }}
            >
              <div className="font-semibold text-slate-800 mb-1">{data[hover].m}</div>
              <div className="text-blue-400">Range : {fmt(data[hover].max - data[hover].min)}</div>
              <div className="text-slate-700 font-medium">Median : {fmt(data[hover].med)}</div>
            </div>
          )}
        </div>
      );
    }

    // ========== MULTI-SELECT DROPDOWN ==========
    function MultiSelectDropdown({ label, options, selected, setSelected, allLabel, searchPlaceholder, showSearch }) {
      const [open, setOpen] = useState(false);
      const [search, setSearch] = useState('');
      const filtered = showSearch ? options.filter(o => o.toLowerCase().includes(search.toLowerCase())) : options;
      const allSelected = selected.length === 0 || selected.length === options.length;
      const display = allSelected ? allLabel : (selected.length === 1 ? selected[0] : selected.length + ' selected');
      return (
        <div className="relative">
          <div className="text-xs font-medium text-slate-500 uppercase mb-1">{label}</div>
          <button type="button" onClick={() => setOpen(!open)}
            className="border border-slate-200 rounded-lg px-3 py-1.5 text-sm min-w-[180px] bg-white text-left flex items-center justify-between gap-2 hover:border-slate-300">
            <span className="truncate text-slate-700">{display}</span>
            <span className="text-slate-400 text-xs">▾</span>
          </button>
          {open && (
            <>
              <div className="fixed inset-0 z-40" onClick={() => setOpen(false)} />
              <div className="absolute z-50 mt-1 w-64 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden">
                {showSearch ? (
                  <div className="p-2 border-b border-slate-100">
                    <input type="text" placeholder={searchPlaceholder || 'Search...'} value={search}
                      onChange={e => setSearch(e.target.value)}
                      className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm" autoFocus />
                  </div>
                ) : (
                  <div className="px-3 py-2 border-b border-slate-100 flex items-center justify-between">
                    <span className="text-xs text-slate-500">Select levels</span>
                    <button type="button" onClick={() => setSelected([])} className="text-xs text-teal-600 font-medium hover:text-teal-700">Select all</button>
                  </div>
                )}
                <div className="max-h-56 overflow-y-auto py-1">
                  {filtered.map(o => {
                    const checked = selected.length === 0 || selected.includes(o);
                    return (
                      <label key={o} className="flex items-center gap-2.5 px-3 py-2 hover:bg-slate-50 cursor-pointer text-sm">
                        <input type="checkbox" checked={checked}
                          onChange={() => {
                            if (selected.length === 0) setSelected([o]);
                            else if (selected.includes(o)) {
                              const next = selected.filter(x => x !== o);
                              setSelected(next.length === 0 ? [] : next);
                            } else {
                              const next = [...selected, o];
                              setSelected(next.length === options.length ? [] : next);
                            }
                          }}
                          className="w-4 h-4 rounded border-slate-300 text-teal-600 accent-teal-600" />
                        <span className="text-slate-700 font-medium tracking-wide">{o}</span>
                      </label>
                    );
                  })}
                  {filtered.length === 0 && <div className="px-3 py-2 text-xs text-slate-400">No matches</div>}
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    // ========== GLOBAL FILTERS ==========
    function GlobalFilters({ region, setRegion, focusMarket, setFocusMarket, funcs, setFuncs, levels, setLevels, extra }) {
      const filteredCountries = region === 'World' ? ALL_COUNTRIES : ALL_COUNTRIES.filter(c => c.region === region);
      const focusCount = filteredCountries.length;
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-5">
          <div className="flex flex-wrap gap-5 items-start">
            <div>
              <div className="text-xs font-medium text-slate-500 uppercase mb-1">Region</div>
              <select className="border border-slate-200 rounded-lg px-3 py-1.5 text-sm min-w-[160px]" value={region}
                onChange={e => {
                  const nextRegion = e.target.value;
                  setRegion(nextRegion);
                  const nextList = nextRegion === 'World' ? ALL_COUNTRIES : ALL_COUNTRIES.filter(c => c.region === nextRegion);
                  // Always keep focus market inside the selected region
                  if (!nextList.find(c => c.name === focusMarket)) {
                    if (nextList[0]) setFocusMarket(nextList[0].name);
                  }
                }}>
                {REGION_OPTIONS.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>
            <div>
              <div className="text-xs font-medium text-slate-500 uppercase mb-1">
                Focus Market · {focusCount} in {region === 'World' ? 'World' : region}
              </div>
              <select className="border border-slate-200 rounded-lg px-3 py-1.5 text-sm min-w-[220px]"
                value={focusMarket} onChange={e => setFocusMarket(e.target.value)}>
                {filteredCountries.map(c => (
                  <option key={c.code} value={c.name}>{c.flag} {c.name}</option>
                ))}
              </select>
            </div>
            <MultiSelectDropdown label="Functions" options={FUNCTIONS} selected={funcs} setSelected={setFuncs}
              allLabel="All functions" searchPlaceholder="Search function..." showSearch={true} />
            <MultiSelectDropdown label="Level" options={LEVELS} selected={levels} setSelected={setLevels}
              allLabel="All levels" showSearch={false} />
            {extra}
          </div>
        </div>
      );
    }

    // ========== DASHBOARD ==========
    function Dashboard({ region, setRegion, focusMarket, setFocusMarket, funcs, setFuncs, levels, setLevels }) {
      const filteredCountries = region === 'World' ? ALL_COUNTRIES : ALL_COUNTRIES.filter(c => c.region === region);
      const focusCount = filteredCountries.length;
      const regionLabel = region === 'World' ? 'World' : region;

      // Every country under the selected region (or all countries when World)
      const regionMarkets = useMemo(() => getMarketsForRegion(region), [region]);
      // Optional: narrow charts to focus country context while still showing region peers
      const analysisMarkets = regionMarkets;

      const kpis = useMemo(() => {
        const list = regionMarkets;
        const ctcs = list.map(m => m.ctc).sort((a,b) => a - b);
        const takes = list.map(m => m.take);
        const median = ctcs[Math.floor(ctcs.length / 2)] || 0;
        const avgTakePct = list.reduce((s,m) => s + (m.take / m.ctc), 0) / (list.length || 1) * 100;
        const top = ctcs[ctcs.length - 1] || 1;
        const bot = ctcs[0] || 1;
        const spread = (top / bot).toFixed(1) + '×';
        // Employer load strictly from countries in this region
        const loads = list.map(m => EMPLOYER_LOAD_BY_CODE[m.code]).filter(v => v != null);
        const avgLoad = loads.length
          ? loads.reduce((a,b)=>a+b,0) / loads.length
          : 12;
        return {
          markets: String(focusCount),
          medianPay: '$' + (median >= 1000 ? (median/1000).toFixed(1) + 'k' : Math.round(median)),
          spread,
          employerLoad: Math.round(avgLoad) + '%',
          takeHome: avgTakePct.toFixed(1) + '%',
        };
      }, [regionMarkets, focusCount]);

      // Rank of focus market within current region markets (by CTC)
      const focusRank = useMemo(() => {
        const fc = ALL_COUNTRIES.find(c => c.name === focusMarket);
        if (!fc) return '—';
        const idx = regionMarkets.findIndex(m => m.code === fc.code);
        if (idx >= 0) return '#' + (idx + 1);
        // fallback global rank in ALL_COUNTRIES
        const g = ALL_COUNTRIES.findIndex(c => c.name === focusMarket);
        return g >= 0 ? '#' + (g + 1) : '—';
      }, [focusMarket, regionMarkets]);

      const focusCountry = ALL_COUNTRIES.find(c => c.name === focusMarket);

      // Pay-by-region bars: World shows all regions; specific region highlights that region with country breakdown via markets
      const regionBars = useMemo(() => {
        if (region === 'World') return REGIONS;
        // Build from regionMarkets average
        const avg = regionMarkets.reduce((s,m)=>s+m.ctc,0) / (regionMarkets.length || 1) / 1000;
        return [{ name: region, count: focusCount, avg: Math.round(avg * 10) / 10 }];
      }, [region, regionMarkets, focusCount]);

      const employerLoadRows = useMemo(() => {
        // Build load % strictly from countries in the selected region
        const rows = regionMarkets.map(m => {
          const p = EMPLOYER_LOAD_BY_CODE[m.code];
          if (p != null) return { c: m.code, p, name: m.name };
          // estimate from region typical if missing
          const regionDefaults = {
            'North America': 10, 'Europe': 25, 'Oceania': 11, 'Middle East': 6,
            'East & SE Asia': 12, 'South Asia': 12, 'Africa': 8, 'Latin America': 20,
            'Caribbean': 10, 'Central Asia': 12,
          };
          return { c: m.code, p: regionDefaults[m.region] || 12, name: m.name, estimated: true };
        }).sort((a, b) => b.p - a.p).slice(0, 14);
        return rows;
      }, [regionMarkets]);

      return (
        <div>
          <div className="mb-5">
            <h1 className="text-2xl font-bold">Executive compensation dashboard</h1>
            <p className="text-slate-500 text-sm mt-1">
              {region === 'World'
                ? 'Global market pay, employer cost and take-home across benchmarked markets — USD at reference rates.'
                : `Analysis for ${regionLabel}: ${regionMarkets.length} countries · focus ${focusMarket} — USD at reference rates.`}
            </p>
          </div>
          <GlobalFilters region={region} setRegion={setRegion} focusMarket={focusMarket} setFocusMarket={setFocusMarket}
            funcs={funcs} setFuncs={setFuncs} levels={levels} setLevels={setLevels} />

          {/* KPI Cards */}
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-5">
            {[
              {l:'MARKETS',v:kpis.markets,s:`of ${TOTAL_MODELLED} modelled`},
              {l:'MEDIAN PAY',v:kpis.medianPay,s:'USD / year'},
              {l:'TOP ÷ BOTTOM',v:kpis.spread,s:'market spread'},
              {l:'EMPLOYER LOAD',v:kpis.employerLoad,s:'avg. on gross'},
              {l:'TAKE-HOME',v:kpis.takeHome,s:'of employer cost'},
            ].map((k,i)=>(
              <div key={i} className="kpi-card bg-white rounded-xl border border-slate-200 p-4">
                <div className="text-xs font-medium text-slate-500 uppercase">{k.l}</div>
                <div className="text-2xl font-bold mt-1">{k.v}</div>
                <div className="text-xs text-slate-400">{k.s}</div>
              </div>
            ))}
            <div className="kpi-card bg-gradient-to-br from-teal-500 to-teal-600 rounded-xl p-4 text-white">
              <div className="text-xs font-medium uppercase opacity-90">FOCUS MARKET</div>
              <div className="text-2xl font-bold mt-1">{focusRank}</div>
              <div className="text-xs mt-0.5">
                {(focusCountry && focusCountry.flag) || ''} {focusMarket}
              </div>
            </div>
          </div>

          {/* Charts row 1 */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
            <MedianByMarketChart markets={regionMarkets} regionLabel={regionLabel} focusCode={focusCountry && focusCountry.code} />
            <div className="bg-white rounded-xl border border-slate-200 p-5">
              <h3 className="font-semibold">{region === 'World' ? 'Pay by region' : 'Pay in ' + region}</h3>
              <p className="text-xs text-slate-500 mb-4">Average median, USD</p>
              <div className="space-y-2.5">
                {region === 'World' ? REGIONS.map((r,i)=>(
                  <div key={i} className="flex items-center gap-2">
                    <div className="w-28 text-xs text-slate-600 truncate">{r.name} · {r.count}</div>
                    <div className="flex-1 h-2.5 bg-slate-100 rounded-full overflow-hidden">
                      <div className="bar-fill h-full bg-blue-500 rounded-full" style={{width:`${(r.avg/210)*100}%`}}></div>
                    </div>
                    <div className="w-14 text-right text-xs font-medium">${r.avg}k</div>
                  </div>
                )) : regionMarkets.map((m,i)=>(
                  <div key={i} className={`flex items-center gap-2 ${m.name === focusMarket || m.code === (focusCountry && focusCountry.code) ? 'font-semibold' : ''}`}>
                    <div className="w-28 text-xs text-slate-600 truncate">{m.code} · {m.name}</div>
                    <div className="flex-1 h-2.5 bg-slate-100 rounded-full overflow-hidden">
                      <div className={`bar-fill h-full rounded-full ${m.name === focusMarket || m.code === (focusCountry && focusCountry.code) ? 'bg-teal-500' : 'bg-blue-500'}`}
                        style={{width:`${(m.ctc / (regionMarkets[0].ctc || 1))*100}%`}}></div>
                    </div>
                    <div className="w-14 text-right text-xs font-medium">${(m.ctc/1000).toFixed(0)}k</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Charts row 2 */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div className="bg-white rounded-xl border border-slate-200 p-5">
              <h3 className="font-semibold">Pay progression · {focusMarket}</h3>
              <p className="text-xs text-slate-500 mb-3">Median with min–max band by level</p>
              <PayProgressionChart />
            </div>
            <div className="bg-white rounded-xl border border-slate-200 p-5">
              <h3 className="font-semibold">Employer cost load</h3>
              <p className="text-xs text-slate-500 mb-3">Statutory employer cost, % of gross · {regionLabel}</p>
              {employerLoadRows.length === 0 && (
                <p className="text-xs text-slate-400">No markets in this region.</p>

              {employerLoadRows.map((d,i)=>(
                <div key={d.c + '-' + i} className="flex items-center gap-2 mb-1.5" title={d.name || d.c}>
                  <div className="w-8 text-xs text-slate-600 font-medium">{d.c}</div>
                  <div className="flex-1 h-3 bg-slate-100 rounded overflow-hidden">
                    <div className="bar-fill h-full bg-amber-500 rounded" style={{width:`${Math.min(100, (d.p/45)*100)}%`}}></div>
                  </div>
                  <div className="w-8 text-xs text-right">{d.p}%</div>
                </div>
              ))}
            </div>
            <div className="bg-white rounded-xl border border-slate-200 p-5">
              <h3 className="font-semibold">Pay range by market</h3>
              <p className="text-xs text-slate-500 mb-3">Min → max with median line · {regionLabel}</p>
              <PayRangeChart markets={regionMarkets} />
            </div>
          </div>

          {/* Cost breakdown stacked */}
          <CostBreakdownChart markets={regionMarkets} regionLabel={regionLabel} />

          {/* Matrix */}
          <div className="bg-white rounded-xl border border-slate-200 p-5 overflow-x-auto">
            <h3 className="font-semibold">Function · level matrix · {focusMarket}</h3>
            <p className="text-xs text-slate-500 mb-4">Median USD / year · darker = higher · indicative scale for focus market</p>
            <table className="w-full text-sm">
              <thead>
                <tr>
                  <th className="text-left py-2 pr-3 text-slate-500 font-medium text-xs">Function</th>
                  {LEVELS.map(l => <th key={l} className="text-center px-1 py-2 text-slate-500 font-medium text-[10px]">{l}</th>)}
                </tr>
              </thead>
              <tbody>
                {FUNCTIONS.map(fn => (
                  <tr key={fn} className="border-t border-slate-100">
                    <td className="py-1.5 pr-3 font-medium text-slate-700 text-xs whitespace-nowrap">{fn}</td>
                    {INDIA_MATRIX[fn].map((val,i) => {
                      let cls = 'bg-teal-50 text-slate-600';
                      if (val >= 100) cls = 'bg-teal-600 text-white';
                      else if (val >= 60) cls = 'bg-teal-500 text-white';
                      else if (val >= 40) cls = 'bg-teal-400 text-slate-900';
                      else if (val >= 25) cls = 'bg-teal-300 text-slate-900';
                      else if (val >= 15) cls = 'bg-teal-200 text-slate-800';
                      else if (val >= 10) cls = 'bg-teal-100 text-slate-700';
                      return (
                        <td key={i} className="px-0.5 py-1 text-center">
                          <span className={`inline-block min-w-[56px] px-1.5 py-1 rounded-md text-[11px] font-medium ${cls}`}>
                            ${val}k
                          </span>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ========== CALCULATOR ==========
    function Calculator({ region, setRegion, focusMarket, setFocusMarket, funcs, setFuncs, levels, setLevels }) {
      const [empType, setEmpType] = useState('Permanent / Regular');
      const [period, setPeriod] = useState('Monthly');
      const [ctc, setCtc] = useState(488725);
      const [oldDed, setOldDed] = useState(150000);
      const [regime, setRegime] = useState('auto'); // auto | new | old
      const focusCountry = ALL_COUNTRIES.find(c => c.name === focusMarket);
      const isIndia = focusMarket === 'India' || (focusCountry && focusCountry.code === 'IN');

      const calc = useMemo(() => {
        // Labour Codes style: basic ≥50% of remuneration
        let basic = ctc * 0.488;
        let empPF = basic * 0.12;
        let gratuity = basic * 0.0481;
        let gross = ctc - empPF - gratuity;
        basic = gross * 0.532;
        empPF = basic * 0.12;
        gratuity = basic * 0.0481;
        gross = ctc - empPF - gratuity;
        const hra = basic * 0.5;
        const special = Math.max(0, gross - basic - hra);
        const empPF_e = basic * 0.12;
        const netBT = gross - empPF_e;
        const annGross = gross * 12;
        const annEmpPF = empPF_e * 12;

        // --- New regime (FY 2025-26 style slabs) ---
        const stdNew = 75000;
        let taxableNew = Math.max(0, annGross - stdNew);
        let taxNewBase = 0;
        if (taxableNew > 1500000) taxNewBase = 187500 + (taxableNew - 1500000) * 0.30;
        else if (taxableNew > 1200000) taxNewBase = 127500 + (taxableNew - 1200000) * 0.20;
        else if (taxableNew > 900000) taxNewBase = 45000 + (taxableNew - 900000) * 0.15;
        else if (taxableNew > 600000) taxNewBase = (taxableNew - 600000) * 0.10;
        else if (taxableNew > 300000) taxNewBase = (taxableNew - 300000) * 0.05;
        // Sec 87A rebate: tax nil if income ≤ 12L (simplified)
        if (annGross <= 1200000) taxNewBase = Math.max(0, taxNewBase - 60000);
        const surchargeNew = taxableNew > 10000000 ? taxNewBase * 0.15 : (taxableNew > 5000000 ? taxNewBase * 0.10 : 0);
        const cessNew = (taxNewBase + surchargeNew) * 0.04;
        const taxNew = taxNewBase + surchargeNew + cessNew;

        // --- Old regime ---
        // Standard deduction 50k + EPF (80C) + user deductions (capped roughly)
        const ded80C = Math.min(150000, annEmpPF + Math.min(oldDed, 150000));
        const otherDed = Math.max(0, oldDed - Math.min(oldDed, 150000)); // remainder as other chapter VIA approx
        const stdOld = 50000;
        let taxableOld = Math.max(0, annGross - stdOld - ded80C - otherDed * 0.5);
        let taxOldBase = 0;
        if (taxableOld > 1000000) taxOldBase = 112500 + (taxableOld - 1000000) * 0.30;
        else if (taxableOld > 500000) taxOldBase = 12500 + (taxableOld - 500000) * 0.20;
        else if (taxableOld > 250000) taxOldBase = (taxableOld - 250000) * 0.05;
        // 87A rebate old: up to 12,500 if taxable ≤ 5L
        if (taxableOld <= 500000) taxOldBase = Math.max(0, taxOldBase - 12500);
        const surchargeOld = taxableOld > 10000000 ? taxOldBase * 0.15 : (taxableOld > 5000000 ? taxOldBase * 0.10 : 0);
        const cessOld = (taxOldBase + surchargeOld) * 0.04;
        const taxOld = taxOldBase + surchargeOld + cessOld;

        // Applied regime
        const better = taxNew <= taxOld ? 'new' : 'old';
        const applied = regime === 'auto' ? better : regime;
        const totalTax = applied === 'new' ? taxNew : taxOld;
        const mTax = totalTax / 12;
        const takeHome = netBT - mTax;
        const thPct = ctc > 0 ? (takeHome / ctc) * 100 : 0;
        const savings = Math.abs(taxOld - taxNew);
        const takeHomeNew = netBT - taxNew / 12;
        const takeHomeOld = netBT - taxOld / 12;

        return {
          m: { ctc, empPF, gratuity, gross, basic, hra, special, empPF_e, netBT, tax: mTax, takeHome },
          a: { ctc: ctc*12, empPF: empPF*12, gratuity: gratuity*12, gross: gross*12, basic: basic*12, hra: hra*12, special: special*12, empPF_e: empPF_e*12, netBT: netBT*12, tax: totalTax, takeHome: takeHome*12 },
          thPct, taxNew, taxOld, applied, better, savings,
          takeHomeNew: takeHomeNew * 12, takeHomeOld: takeHomeOld * 12,
          taxableNew, taxableOld
        };
      }, [ctc, oldDed, regime]);

      const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');

      return (
        <div>
          <GlobalFilters region={region} setRegion={setRegion} focusMarket={focusMarket} setFocusMarket={setFocusMarket}
            funcs={funcs} setFuncs={setFuncs} levels={levels} setLevels={setLevels} />
          <div className="flex flex-col lg:flex-row gap-6">
          <div className="w-full lg:w-80 space-y-4 shrink-0">
            <div className="bg-white rounded-xl border border-slate-200 p-5">
              <div className="text-xs font-semibold text-slate-500 uppercase mb-3">1 · Market</div>
              <label className="block text-xs text-slate-500 mb-1">Country</label>
              <div className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3 bg-slate-50">
                {(focusCountry && focusCountry.flag) || ''} {focusMarket}
              </div>
              {isIndia && (
                <>
                  <label className="block text-xs text-slate-500 mb-1">Tax regime (India)</label>
                  <select className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-2"
                    value={regime} onChange={e => setRegime(e.target.value)}>
                    <option value="auto">Auto · lower tax (recommended)</option>
                    <option value="new">New regime</option>
                    <option value="old">Old regime</option>
                  </select>
                  <div className="text-xs text-slate-500 bg-slate-50 rounded-lg px-2.5 py-2 mb-1">
                    {regime === 'auto' && <>Applying <strong>{calc.better === 'new' ? 'New' : 'Old'}</strong> regime (lower tax by {fmt(calc.savings)}/yr)</>}
                    {regime === 'new' && <>New regime applied · standard deduction ₹75,000</>}
                    {regime === 'old' && <>Old regime applied · use deductions below</>}
                  </div>
                </>
              )}
              {!isIndia && (
                <>
                  <label className="block text-xs text-slate-500 mb-1">Tax treatment</label>
                  <select className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                    <option>Local statutory model</option>
                  </select>
                </>
              )}
            </div>
            <div className="bg-white rounded-xl border border-slate-200 p-5">
              <div className="text-xs font-semibold text-slate-500 uppercase mb-3">2 · Salary input</div>
              <label className="block text-xs text-slate-500 mb-1">Employment type</label>
              <select className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-2" value={empType} onChange={e=>setEmpType(e.target.value)}>
                <option>Permanent / Regular</option>
                <option>Fixed-term contract</option>
                <option>Temporary / seasonal</option>
                <option>Third-party / agency</option>
                <option>Independent consultant</option>
                <option>Freelancer (self-employed)</option>
              </select>
              <p className="text-xs text-slate-400 mb-3">Temporary and contract workers can remove standard salary components when the organisation pays the amount as a full payment.</p>
              <label className="block text-xs text-slate-500 mb-1">Pay period</label>
              <div className="flex gap-2 mb-3">
                {['Monthly','Annual'].map(p=>(
                  <button key={p} onClick={()=>setPeriod(p)} className={`flex-1 py-1.5 rounded-lg text-sm font-medium ${period===p?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}`}>{p}</button>
                ))}
              </div>
              <label className="block text-xs text-slate-500 mb-1">Amount is</label>
              <select className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3"><option>Cost to company (CTC)</option><option>Gross pay</option></select>
              <label className="block text-xs text-slate-500 mb-1">Enter monthly CTC</label>
              <input type="number" value={ctc} onChange={e=>setCtc(+e.target.value||0)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-1" />
              <div className="flex justify-between text-xs text-slate-400 mb-2"><span>Monthly CTC · {fmt(ctc)}</span><span>{fmt(ctc*12)}</span></div>
              <input type="range" min="50000" max="2000000" step="5000" value={ctc} onChange={e=>setCtc(+e.target.value)} className="w-full mb-4" />
              <button className="w-full border border-slate-200 rounded-lg py-2 text-sm text-slate-600 hover:bg-slate-50 mb-3">☰ Customize components</button>
              {isIndia && (regime === 'old' || regime === 'auto') && (
                <>
                  <label className="block text-xs text-slate-500 mb-1">Old-regime deductions / exemptions per year</label>
                  <input type="number" value={oldDed} onChange={e=>setOldDed(+e.target.value||0)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
                  <p className="text-xs text-slate-400 mt-1">HRA / 80C / 80D / 80CCD(1B) NPS / home-loan interest. Employee PF is counted under 80C (₹1.5L cap).</p>
                </>
              )}
            </div>
          </div>

          <div className="flex-1 space-y-4">
            <div className="bg-white rounded-xl border border-slate-200 p-5">
              <div className="flex justify-between items-start mb-4">
                <div>
                  <h2 className="font-semibold text-lg">Salary outcome</h2>
                  <p className="text-sm text-slate-500">{(focusCountry && focusCountry.flag) || ''} {focusMarket} · {empType}</p>
                </div>
                <div className="flex flex-col items-end gap-1">
                  <span className="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded">New Labour Codes · Framework Updated</span>
                  {isIndia && (
                    <span className={`text-xs px-2 py-1 rounded font-medium ${calc.applied === 'new' ? 'bg-teal-100 text-teal-700' : 'bg-amber-100 text-amber-800'}`}>
                      {calc.applied === 'new' ? 'New regime' : 'Old regime'} applied
                    </span>
                  )}
                </div>
              </div>
              <div className="grid grid-cols-3 gap-3 mb-5">
                <div className="bg-slate-50 rounded-xl p-4">
                  <div className="text-xs text-slate-500 uppercase">Gross pay</div>
                  <div className="text-xl font-bold mt-1">{fmt(calc.m.gross)}</div>
                  <div className="text-xs text-slate-400">per month</div>
                </div>
                <div className="bg-gradient-to-br from-teal-500 to-teal-600 text-white rounded-xl p-4">
                  <div className="text-xs opacity-90 uppercase">Estimated take-home</div>
                  <div className="text-xl font-bold mt-1">{fmt(calc.m.takeHome)}</div>
                  <div className="text-xs opacity-80">{calc.thPct.toFixed(1)}% of CTC</div>
                </div>
                <div className="bg-slate-50 rounded-xl p-4">
                  <div className="text-xs text-slate-500 uppercase">Gross tax deduction</div>
                  <div className="text-xl font-bold mt-1">{fmt(calc.m.tax)}</div>
                  <div className="text-xs text-slate-400">Tax {((calc.m.tax/calc.m.gross)*100).toFixed(1)}% of gross</div>
                </div>
              </div>
              <table className="w-full text-sm">
                <thead><tr className="bg-slate-900 text-white">
                  <th className="text-left py-2 px-3 rounded-tl-lg">Salary</th>
                  <th className="text-right py-2 px-3">Monthly</th>
                  <th className="text-right py-2 px-3 rounded-tr-lg">Annual</th>
                </tr></thead>
                <tbody className="divide-y divide-slate-100">
                  <tr className="font-medium"><td className="py-2 px-3">CTC</td><td className="text-right py-2 px-3">{fmt(calc.m.ctc)}</td><td className="text-right py-2 px-3">{fmt(calc.a.ctc)}</td></tr>
                  <tr className="bg-slate-50 text-xs text-slate-500"><td colSpan="3" className="py-1.5 px-3">EMPLOYER COSTS (INCLUDED IN CTC)</td></tr>
                  <tr><td className="py-1.5 px-3 text-slate-600">+ Employer PF (12% of basic)</td><td className="text-right py-1.5 px-3">{fmt(calc.m.empPF)}</td><td className="text-right py-1.5 px-3">{fmt(calc.a.empPF)}</td></tr>
                  <tr><td className="py-1.5 px-3 text-slate-600">+ Gratuity (4.81% of basic)</td><td className="text-right py-1.5 px-3">{fmt(calc.m.gratuity)}</td><td className="text-right py-1.5 px-3">{fmt(calc.a.gratuity)}</td></tr>
                  <tr className="font-medium"><td className="py-2 px-3">Gross</td><td className="text-right py-2 px-3">{fmt(calc.m.gross)}</td><td className="text-right py-2 px-3">{fmt(calc.a.gross)}</td></tr>
                  <tr><td className="py-1.5 px-3 text-slate-600">Basic (50% of remuneration)</td><td className="text-right py-1.5 px-3">{fmt(calc.m.basic)}</td><td className="text-right py-1.5 px-3">{fmt(calc.a.basic)}</td></tr>
                  <tr><td className="py-1.5 px-3 text-slate-600">HRA (50% of basic)</td><td className="text-right py-1.5 px-3">{fmt(calc.m.hra)}</td><td className="text-right py-1.5 px-3">{fmt(calc.a.hra)}</td></tr>
                  <tr><td className="py-1.5 px-3 text-slate-600">Special allowance</td><td className="text-right py-1.5 px-3">{fmt(calc.m.special)}</td><td className="text-right py-1.5 px-3">{fmt(calc.a.special)}</td></tr>
                  <tr className="bg-slate-50 text-xs text-slate-500"><td colSpan="3" className="py-1.5 px-3">EMPLOYEE CONTRIBUTIONS</td></tr>
                  <tr><td className="py-1.5 px-3 text-slate-600">− Employee PF (12% of basic)</td><td className="text-right py-1.5 px-3">{fmt(calc.m.empPF_e)}</td><td className="text-right py-1.5 px-3">{fmt(calc.a.empPF_e)}</td></tr>
                  <tr className="font-medium"><td className="py-2 px-3">Net (before income tax)</td><td className="text-right py-2 px-3">{fmt(calc.m.netBT)}</td><td className="text-right py-2 px-3">{fmt(calc.a.netBT)}</td></tr>
                  <tr className="bg-slate-50 text-xs text-slate-500"><td colSpan="3" className="py-1.5 px-3">INCOME TAX · {calc.applied === 'new' ? 'NEW REGIME' : 'OLD REGIME'}</td></tr>
                  <tr><td className="py-1.5 px-3 text-slate-600">− Income tax (incl. surcharge + 4% cess)</td><td className="text-right py-1.5 px-3">{fmt(calc.m.tax)}</td><td className="text-right py-1.5 px-3">{fmt(calc.a.tax)}</td></tr>
                  <tr className="font-semibold bg-teal-50"><td className="py-2 px-3">Post-tax net (take-home)</td><td className="text-right py-2 px-3">{fmt(calc.m.takeHome)}</td><td className="text-right py-2 px-3">{fmt(calc.a.takeHome)}</td></tr>
                </tbody>
              </table>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-white rounded-xl border border-slate-200 p-5">
                <h3 className="font-semibold mb-3">Where the CTC goes</h3>
                {[
                  {l:'Take-home',p:calc.thPct,c:'bg-emerald-500'},
                  {l:'Income tax',p:(calc.m.tax/ctc)*100,c:'bg-amber-500'},
                  {l:'Employee contrib.',p:(calc.m.empPF_e/ctc)*100,c:'bg-blue-500'},
                  {l:'Employer cost',p:((calc.m.empPF+calc.m.gratuity)/ctc)*100,c:'bg-slate-800'},
                ].map((x,i)=>(
                  <div key={i} className="flex items-center gap-3 mb-2">
                    <div className="w-28 text-sm text-slate-600">{x.l}</div>
                    <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${x.c} rounded-full`} style={{width:`${Math.min(x.p,100)}%`}}></div></div>
                    <div className="w-12 text-right text-sm font-medium">{x.p.toFixed(1)}%</div>
                  </div>
                ))}
              </div>
              <div className="bg-white rounded-xl border border-slate-200 p-5">
                <h3 className="font-semibold mb-3">{isIndia ? 'India regime comparison (annual)' : 'Tax summary (annual)'}</h3>
                {isIndia ? (
                  <>
                    <div className="grid grid-cols-2 gap-3 mb-3">
                      <button type="button" onClick={() => setRegime('new')}
                        className={`text-left rounded-xl border p-3 transition ${calc.applied === 'new' ? 'border-teal-500 bg-teal-50 ring-1 ring-teal-500' : 'border-slate-200 hover:border-slate-300'}`}>
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-xs font-medium text-slate-500 uppercase">New regime</span>
                          {calc.better === 'new' && <span className="text-[10px] bg-teal-600 text-white px-1.5 py-0.5 rounded-full">Better</span>}
                        </div>
                        <div className="text-lg font-bold text-teal-700">{fmt(calc.taxNew)}</div>
                        <div className="text-xs text-slate-500 mt-0.5">Take-home {fmt(calc.takeHomeNew)}/yr</div>
                      </button>
                      <button type="button" onClick={() => setRegime('old')}
                        className={`text-left rounded-xl border p-3 transition ${calc.applied === 'old' ? 'border-amber-500 bg-amber-50 ring-1 ring-amber-500' : 'border-slate-200 hover:border-slate-300'}`}>
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-xs font-medium text-slate-500 uppercase">Old regime</span>
                          {calc.better === 'old' && <span className="text-[10px] bg-amber-600 text-white px-1.5 py-0.5 rounded-full">Better</span>}
                        </div>
                        <div className="text-lg font-bold text-amber-800">{fmt(calc.taxOld)}</div>
                        <div className="text-xs text-slate-500 mt-0.5">Take-home {fmt(calc.takeHomeOld)}/yr</div>
                      </button>
                    </div>
                    <div className={`rounded-lg px-3 py-2 text-sm ${calc.better === 'new' ? 'bg-teal-50 text-teal-800' : 'bg-amber-50 text-amber-900'}`}>
                      <strong>Recommendation:</strong> Opt for the <strong>{calc.better === 'new' ? 'New' : 'Old'}</strong> regime —
                      saves <strong>{fmt(calc.savings)}</strong> in tax per year
                      {calc.better === 'old' ? ' with your current deductions' : ' (default for most salaried profiles)'}.
                    </div>
                    <button type="button" onClick={() => setRegime('auto')}
                      className="mt-2 text-xs text-slate-500 hover:text-slate-800 underline">
                      Reset to Auto · lower tax
                    </button>

                ) : (
                  <p className="text-sm text-slate-500">Select India as Focus Market to compare Old vs New tax regimes.</p>

            {/* Same pay, different engagement */}
            <EngagementCompareChart annualTakeHome={calc.a.takeHome} fmt={fmt} />

            <div className="bg-slate-50 rounded-xl border border-slate-200 p-4 text-xs text-slate-500">
              <strong>Method & compliance notes</strong><br/>
              India FY 2026-27 under the Labour Codes wage definition (basic ≥ 50% of remuneration). New regime: ₹75,000 standard deduction, 87A rebate to ₹12L with marginal relief. Old regime: ₹50,000 standard deduction, EPF under 80C plus your deductions. Surcharge 10/15/25(/37)% with marginal relief, 4% cess. ESI applies where gross ≤ ₹21,000/month. Planning estimate only — verify with local payroll before relying on it.
            </div>
          </div>
        </div>
        </div>
      );
    }

    function EngagementCompareChart({ annualTakeHome, fmt }) {
      const [hover, setHover] = useState(null);
      // Approximate relative take-home by engagement model (Permanent as baseline)
      const models = [
        { l: 'Permanent / Regular', mult: 1.00, active: true },
        { l: 'Fixed-term contract', mult: 0.98 },
        { l: 'Temporary / seasonal', mult: 0.92 },
        { l: 'Third-party / agency', mult: 0.88 },
        { l: 'Independent consultant', mult: 1.05 },
        { l: 'Freelancer (self-employed)', mult: 1.08 },
      ];
      const maxVal = Math.max(...models.map(m => annualTakeHome * m.mult));
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="font-semibold">Same pay, different engagement</h3>
          <p className="text-xs text-slate-500 mb-4">Annual take-home for the same amount under each model</p>
          <div className="space-y-2.5">
            {models.map((m, i) => {
              const val = annualTakeHome * m.mult;
              const pct = (val / maxVal) * 100;
              return (
                <div
                  key={i}
                  className="flex items-center gap-3 relative cursor-pointer"
                  onMouseEnter={() => setHover(i)}
                  onMouseLeave={() => setHover(null)}
                >
                  <div className="w-36 text-xs text-slate-600 text-right shrink-0 leading-tight">{m.l}</div>
                  <div className="flex-1 h-7 bg-slate-100 rounded relative">
                    <div
                      className={`h-full rounded transition-all ${m.active || hover === i ? 'bg-teal-500' : 'bg-slate-300'}`}
                      style={{ width: `${pct}%` }}
                    />
                  </div>
                  {hover === i && (
                    <div className="absolute left-1/2 -translate-x-1/2 bottom-full mb-1 bg-white border border-slate-200 rounded-lg shadow-lg px-3 py-2 text-xs z-20 whitespace-nowrap pointer-events-none">
                      <div className="font-semibold text-slate-800 mb-0.5">{m.l}</div>
                      <div className="text-slate-700">takeHome : {fmt(val)}</div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ========== ENGAGEMENT ==========

    function getAdminPassword() {
      try { return localStorage.getItem(ADMIN_PW_KEY) || DEFAULT_ADMIN_PW; } catch (e) { return DEFAULT_ADMIN_PW; }
    }
    function setAdminPassword(pw) {
      try { localStorage.setItem(ADMIN_PW_KEY, pw); } catch (e) {}
    }
    function loadSignInLog() {
      try {
        const raw = localStorage.getItem(LOG_KEY);
        if (raw) return JSON.parse(raw);
        // Seed first-visit demo so admin log is not empty
        const seed = [{
          id: 'seed-1',
          date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
          time: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }),
          ts: Date.now(),
          email: 'tenzingtinlay@gmail.com',
          name: 'Tenzing Tinlay',
          event: 'Registered',
        }];
        localStorage.setItem(LOG_KEY, JSON.stringify(seed));
        return seed;
      } catch (e) { return []; }
    }
    function saveSignInLog(entries) {
      try { localStorage.setItem(LOG_KEY, JSON.stringify(entries.slice(0, 500))); } catch (e) {}
    }
    function logSignInEvent({ email, name, event }) {
      const now = new Date();
      const entry = {
        id: now.getTime() + '-' + Math.random().toString(36).slice(2, 7),
        date: now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
        time: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }),
        ts: now.getTime(),
        email: email || 'guest@compensationiq.app',
        name: name || 'Guest user',
        event: event || 'Signed in',
      };
      const list = loadSignInLog();
      list.unshift(entry);
      saveSignInLog(list);
      // Also post to backend when running via npm start
      try {
        fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: entry.email, name: entry.name, event: entry.event }),
        }).catch(function () {});
      } catch (e) {}
      return entry;
    }
