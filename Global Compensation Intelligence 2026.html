const countryRules={
  IN:{name:'India',social:'EPF/ESI and other statutory payroll items remain subject to worker coverage and wage thresholds; direct fixed-term employees are treated separately from contract labour through a contractor.',benefits:'Leave is generally prorated. Under Social Security Code / Labour Ministry FAQ, a directly engaged fixed-term employee can qualify for gratuity after one year; contract labour follows different gratuity responsibility.',notice:'Contractual; tech/knowledge roles commonly 30–90 days (often 60–90). Probation often 15–30 days. Statutory floor for workmen under ID Act differs from managerial contracts.',severanceTerm:'Retrenchment (workmen): 15 days average pay per completed year + notice or pay in lieu (ID Act). Managerial/knowledge roles: contractual / discretionary (often 1 month per year capped 6–12 months in practice). Gratuity after 5 years (permanent) or 1 year (fixed-term direct).',severanceVol:'Resignation: contractual notice only; gratuity if qualifying service met. No general statutory voluntary severance for managers.',leave:'State/establishment dependent; maternity 26 weeks for qualifying employees; no single national private-sector annual-leave floor.',gratuity6:false,gratuity12:true,consultant:'Independent consultants usually invoice as professional fees; TDS u/s 194J may apply; no EPF/ESI/gratuity unless misclassified as employee.',thirdparty:'Contract labour through a licensed contractor: principal employer has specific statutory responsibilities; gratuity and PF often sit with the contractor.'},
  US:{name:'United States',social:'Federal/state/local withholding and FICA continue where the worker is an employee. Independent contractors receive Form 1099; no FICA withholding by the engager.',benefits:'No single federal fixed-term benefit package; paid leave and employer benefits depend on plan terms and state/local law. ACA applicability depends on employer size and employee status.',notice:'At-will in most states (no statutory notice). Contracts, offer letters and state law can create notice or severance obligations. Senior/exec contracts often 1–3 months.',severanceTerm:'No general federal statutory severance for private employees. WARN Act (60 days) may apply to mass layoffs. Contractual/policy severance is common for mid/senior roles.',severanceVol:'Resignation: typically no severance unless contract/policy provides. Accrued PTO may be payable by state law.',leave:'No federal paid annual leave mandate; FMLA unpaid leave for qualifying employers/employees; state paid-leave programs vary.',gratuity6:false,gratuity12:false,consultant:'True independent contractors: no FICA withholding, no employee benefits; misclassification risk is high (ABC tests / IRS factors).',thirdparty:'Staffing-agency employees: the agency is typically the employer of record for payroll/tax; joint-employment analysis can still apply.'},
  GB:{name:'United Kingdom',social:'PAYE and National Insurance generally continue for employees. Fixed-term employees should receive the same or equivalent pay and benefits as comparable permanent staff, subject to objective justification.',benefits:'Statutory holiday (5.6 weeks) and other qualifying benefits are generally prorated. Agency workers can acquire equal-treatment rights after 12 weeks in the same role.',notice:'Statutory minimum: 1 week after 1 month, then 1 week per year of service capped at 12 weeks. Contracts often 1–3 months for professional roles.',severanceTerm:'Statutory redundancy (2+ years service): 0.5–1.5 weeks’ pay per year by age band, weekly pay capped (~£751 2026), max 20 years. Unfair dismissal protection after 2 years.',severanceVol:'Resignation: contractual notice only; no statutory redundancy on voluntary exit.',leave:'5.6 weeks paid annual leave (includes bank holidays in many arrangements); SSP and other statutory rights subject to qualifying rules.',gratuity6:false,gratuity12:false,consultant:'IR35 / off-payroll rules can treat contractors as employees for tax if inside IR35; status determination is critical.',thirdparty:'Agency workers: Agency Workers Regulations equal treatment after 12 weeks; PAYE often via umbrella/agency.'},
  DE:{name:'Germany',social:'Payroll tax and statutory social insurance generally apply to employees regardless of permanent versus fixed-term status, subject to normal eligibility and ceilings.',benefits:'Statutory leave (minimum 20 working days / 24 calendar days under BUrlG for 6-day week; often 30 days by contract) is prorated. Fixed-term status does not remove social insurance.',notice:'Ordinary notice scales with tenure under BGB §622 (from 4 weeks to the 15th/month-end up to 7 months at long service). Contracts can lengthen but not shorten below statutory for employers.',severanceTerm:'No general statutory severance for ordinary termination; ~0.5 month per year is a common social-plan / settlement benchmark. Works council and social justification dominate process risk.',severanceVol:'Resignation: employee notice often 4 weeks to month-end unless contract says otherwise; no statutory severance.',leave:'Minimum 20 working days (5-day week); maternity, parental and care leave under separate statutes.',gratuity6:false,gratuity12:false,consultant:'Selbständige / freelancers: no employee social insurance if genuinely independent; Scheinselbständigkeit (false self-employment) risk is material.',thirdparty:'Temporary agency work (AÜG) is tightly regulated; equal pay and maximum assignment durations apply.'},

Calculator(){const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],mo=(sel)=>MO.map((m,i)=>`<option value="${i+1}" ${i+1===sel?'selected':''}>${m}</option>`).join('');

<button class="go">Calculate</button>`,'<div class="card mut">Enter an amount and calculate.</div>');
 const sync=()=>{const w=$('#wt').value,p=w==='permanent',n=w==='consultant'||w==='freelance';$('#mo').disabled=p;$('#sm').disabled=p;$('#exp').disabled=!n;$('#exl').style.opacity=n?1:.5;$('#basis').disabled=n};
 const go=async()=>{try{const r=await api('calculate',{country:$('#country').value,workerType:$('#wt').value,months:+$('#mo').value,startMonth:+$('#sm').value,fyStart:+$('#fy').value,amount:+$('#amt').value,period:$('#per').value,basis:$('#basis').value,regime:$('#reg').value,deductions:+$('#ded').value,expensesPct:+$('#exp').value});const c=r.country.code,t=r.totals,m=r.monthly,n=r.months,f=r.fiscal;
 out(`<div class="card"><div class="mut">${r.country.flag} ${esc(r.country.name)} ${tier(r.country)} <span class="tag">${esc(r.worker.label)}${r.worker.type==='permanent'?'':' · '+n+' months'}</span></div><div class="big">${money(c,m.takeHome)} <span class="mut">/ month take-home</span></div>
 <div class="kpis"><div class="kpi">Take-home<b>${r.ratios.takeHomePct}%</b></div><div class="kpi">Income tax<b>${r.ratios.taxPct}%</b></div><div class="kpi">Employee contributions<b>${r.ratios.contribPct}%</b></div><div class="kpi">Total wedge<b>${r.ratios.wedgePct}%</b></div></div>
 ${tbl(['Item','Per month','Total for '+(r.worker.type==='permanent'?'12 months':n+' months')],[[r.worker.nonEmployee?'Fee paid':'Employer cost (CTC)',money(c,m.ctc),money(c,t.ctc)],t.engagerCost>t.ctc+1?['Total cost to you (with uplift)',money(c,t.engagerCost/n),money(c,t.engagerCost)]:null,r.worker.nonEmployee?null:['Gross salary',money(c,m.gross),money(c,t.gross)],...r.employer.map(x=>['Employer: '+esc(x.label),money(c,x.period/n),money(c,x.period)]),...r.employee.map(x=>['Employee: '+esc(x.label),'−'+money(c,x.period/n),'−'+money(c,x.period)]),r.expenses?['Business expenses','−'+money(c,r.expenses/n),'−'+money(c,r.expenses)]:null,...r.tax.map(x=>[esc(x.label),'−'+money(c,x.period/n),'−'+money(c,x.period)]),['<b>Take-home</b>','<b>'+money(c,m.takeHome)+'</b>','<b>'+money(c,t.takeHome)+'</b>']].filter(Boolean))}
 <h3>Tax by fiscal year (starts ${f.startsIn})</h3>${tbl(['Fiscal year','Months','Income','Tax'],f.periods.map(x=>[esc(x.label),x.months,money(c,x.income),money(c,x.tax)]))}
 ${f.oneYearTax!==null?`<p class="mut">If all of this income fell in one fiscal year the tax would be ${money(c,f.oneYearTax)}; splitting saves ${money(c,f.oneYearTax-t.incomeTax)}.</p>`:''}
 ${r.structure.length?'<h3>Salary structure</h3>'+tbl(['Component','Amount'],r.structure.map(x=>[esc(x.label),money(c,x.period)])):''}
 <h3>Same pay, different engagement</h3>${tbl(['Type','Cost','Take-home','Share'],r.engagements.map(x=>[esc(x.label)+(x.type===r.worker.type?' ✓':''),money(c,x.cost),money(c,x.takeHome),x.takePct+'%']))}
 ${r.notes.map(x=>`<p class="mut">${esc(x)}</p>`).join('')}<p class="mut">${esc(r.method||'')}</p></div>`)}catch(e){bad(e)}};
 bind(go);$('#wt').addEventListener('change',sync);sync()},

 out(`<div class="card"><div class="mut">${r.country.flag} ${esc(r.country.name)} · ${r.months} months</div><h3 style="margin:4px 0">${esc(r.label)}</h3>
 <p><span class="tag ${r.payroll.on?'':'w'}">${r.payroll.on?'On your payroll':'Not on your payroll'}</span> <span class="mut">Employer: ${esc(r.payroll.employer)}</span></p><p>${esc(r.payroll.summary)}</p>
 <div class="kpis"><div class="kpi">Covered<b>${k.covered}</b></div><div class="kpi">Check eligibility<b>${k.verify}</b></div><div class="kpi">Via agency / EOR<b>${k.agency}</b></div><div class="kpi">Provider handles<b>${k.providerHandles}</b></div><div class="kpi">Not covered<b>${k.notCovered}</b></div></div></div>
 <div class="card"><h3 style="margin-top:0">Benefit by benefit</h3><div class="cards">${r.rows.map(x=>`<div class="card"><h4>${esc(x.title)}</h4><span class="tag st-${ST[x.status][1]}">${ST[x.status][0]}</span><div class="mut" style="margin-top:6px">${esc(x.note)}</div>${x.local?`<div style="margin-top:6px;font-size:.85rem"><b>${esc(r.country.name)}:</b> ${esc(x.local)}</div>`:''}</div>`).join('')}</div>
 <p class="mut">${r.localCoverage} of ${r.rows.length} items have country-specific text for ${esc(r.country.name)}; the rest show the general position.</p></div>
 <div class="card"><h3 style="margin-top:0">All six models side by side</h3><div class="wrap"><table><tr><th>Benefit</th>${TY.map(x=>`<th class="n" title="${x[1]}">${x[1].split(' ')[0]}</th>`).join('')}</tr>${r.matrix.rows.map(x=>`<tr><td>${esc(x.title)}</td>${x.cells.map(s=>`<td class="n st-c-${ST[s][1]}" title="${ST[s][0]}">${SY[s]}</td>`).join('')}</tr>`).join('')}</table></div>
 <p class="mut">✓ covered · ◐ prorated · ? depends on eligibility · A via agency or EOR · S provider handles · ✕ not covered</p></div>
 <div class="card"><h3 style="margin-top:0">Risks to check</h3><ul>${r.risks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Before you hire</h3><ul>${r.checklist.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 <div class="card"><h3 style="margin-top:0">${esc(r.country.name)} rules</h3>${r.rules?tbl(['Topic','Rule'],r.rules.map(x=>[esc(x[0]),esc(x[1])])).replace(/class="n"/g,''):`<p class="mut">${esc(r.ruleNote)}</p>`}</div>`)}catch(e){bad(e)}};
 bind(go)},
