mut);font-size:.76rem}.calc-structure{margin-top:10px}.calc-structure label{display:flex;align-items:center;gap:8px;margin:0}.calc-structure input[type=checkbox]{width:auto;min-height:0}.calc-custom{display:none;margin-top:9px;padding:9px;border:1px solid var(--line);border-radius:8px}.calc-custom.open{display:block}</style></head><body>

 if(b!==undefined&&POST[r[0]])o=POST[r[0]](b);else if(r[0]==='meta')o={roles:E.ROLES,levels:E.LEVELS,countries:E.countries()};

 ${R.map(x=>`<circle cx="${X(x.usd)}" cy="${Y(x.take)}" r="6" fill="var(--acc)" opacity=".75"/><text x="${X(x.usd)+9}" y="${Y(x.take)+4}">${x.country.code}</text>`).join('')}</svg>`};
