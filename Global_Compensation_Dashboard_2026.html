<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Global Compensation Intelligence — Dashboard Preview</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mut:#667085;--line:#dbe2ea;--acc:#0b8f7e;--acc2:#e9f6f3;--blue:#315ea8;--shadow:0 8px 24px rgba(20,33,61,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(120deg,#10233f,#1d4663);color:#fff;padding:18px 22px}.topin{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;opacity:.72;font-size:12px}.year{padding:7px 10px;border:1px solid rgba(255,255,255,.2);border-radius:8px;font-size:12px}.wrap{max-width:1280px;margin:auto;padding:14px}.toolbar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1.2fr 1.2fr 1fr auto auto;gap:8px;align-items:start}.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mut);letter-spacing:.05em;margin:0 0 4px}.select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.multi{position:relative}.menu{display:none;position:absolute;top:43px;left:0;width:280px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(20,33,61,.16);padding:7px;z-index:20}.multi.open .menu{display:block}.search{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px}.opt{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;font-size:13px}.opt:hover{background:var(--bg)}.opt input{accent-color:var(--acc)}.menuhead{display:flex;justify-content:space-between;align-items:center;padding:4px 7px 7px;font-size:11px;color:var(--mut)}.link{color:var(--acc);cursor:pointer;font-weight:700}.field{position:relative;min-width:0}.chips{display:flex;gap:4px;margin-top:5px;overflow:hidden;height:0;position:relative;z-index:1}.btn{align-self:end;margin-top:14px}.chip{background:var(--acc2);border-radius:99px;padding:2px 7px;font-size:10px;white-space:nowrap}.btn{height:38px;border-radius:8px;padding:0 13px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:11px 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}.kpi:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--acc);opacity:.8}.kpi small{color:var(--mut);font-size:10px}.kpi b{display:block;font-size:18px;margin-top:2px}.kpi span{font-size:10px;color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;box-shadow:var(--shadow);min-width:0}.card h3{font-size:13px;margin:0 0 9px}.sub{font-size:10px;color:var(--mut);float:right;font-weight:400}.barrow{display:grid;grid-template-columns:72px 1fr 58px;gap:7px;align-items:center;margin:6px 0;font-size:10px}.bar{height:9px;background:#e8edf2;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}.bar.blue i{background:var(--blue)}.heat{display:grid;grid-template-columns:130px repeat(5,1fr);gap:2px;font-size:9px}.heat div{padding:6px 4px;border-radius:3px;text-align:center}.heat .h{background:#f1f4f7;font-weight:700}.heat .v{background:color-mix(in srgb,var(--acc) 25%,#fff)}.heat .v2{background:color-mix(in srgb,var(--acc) 45%,#fff)}.heat .v3{background:color-mix(in srgb,var(--acc) 65%,#fff)}.legend{font-size:9px;color:var(--mut);margin-top:7px}.linechart{height:115px;position:relative;border-bottom:1px solid var(--line);border-left:1px solid var(--line);margin:4px 0 0}.linechart svg{width:100%;height:100%}.donut{display:flex;align-items:center;gap:15px}.ring{width:100px;height:100px;border-radius:50%;background:conic-gradient(var(--acc) 0 43%,#315ea8 43% 69%,#d7a72f 69% 84%,#cbd3dc 84%);position:relative}.ring:after{content:'100%';position:absolute;inset:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800}.key div{font-size:10px;margin:5px 0}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.full{grid-column:1/-1}.half{grid-column:span 6}.third{grid-column:span 4}.two{grid-column:span 8}.one{grid-column:span 4}.note{font-size:10px;color:var(--mut);margin-top:7px}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.half,.third,.two,.one{grid-column:1/-1}}@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.menu{width:100%}.topin{align-items:start}.year{display:none}}
 .selectNative{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}.selectNative:focus{outline:2px solid rgba(11,143,126,.18);outline-offset:1px}
</style></head><body>
<header class="top"><div class="topin"><div class="brand"><h1>Global Compensation Intelligence</h1><p>Executive dashboard · compensation, employer cost & take-home intelligence</p></div><div class="year">2026 Planning Model</div></div></header>
<main class="wrap">
<section class="toolbar">
<div class="field"><label>Region</label><select id="regionSel" class="selectNative"><option value="ALL">World</option></select></div>
<div class="field multi" id="fn"><label>Functions</label><div class="select" id="fnSelect"><span id="fnText">All functions</span><span>⌄</span></div><div class="menu" id="fnMenu"></div></div>
<div class="field multi" id="lv"><label>Level</label><div class="select" id="lvSelect"><span id="lvText">All levels</span><span>⌄</span></div><div class="menu" id="lvMenu"></div></div>
<div class="field"><label>Focus country</label><select id="focusSel" class="selectNative"></select></div>
<button class="btn" id="clearBtn">Clear</button><button id="submitBtn" class="btn primary">Submit</button>
</section>
<div id="status" class="note"></div><section id="kpis" class="kpis"></section><section id="grid" class="grid"></section>
</main>
<script>
(function(){
const REGIONS={NAM:'North America',LAC:'Latin America',EUR:'Europe',ME:'Middle East',AF:'Africa',SAS:'South Asia',EAP:'East & SE Asia',OCE:'Oceania'};
let META=null,selectedRoles=[],selectedLevels=[];
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'$'+Math.round(v||0).toLocaleString('en-US')+'K',pct=v=>Math.round((v||0)*10)/10+'%';
const RG={NAM:'US CA MX',LAC:'BR AR CL CO PE UY PY BO EC VE CR PA GT HN SV NI DO CU JM HT BS BB BZ DM GD LC VC AG KN TT GY SR',EUR:'GB DE FR ES IT NL BE AT CH IE PT PL CZ HU RO SE NO DK FI EE LT LV SK SI HR BG GR CY MT LU IS UA RS BA ME MK AL MD BY RU TR AD MC SM VA XK',ME:'AE SA QA KW BH OM IL JO LB IQ IR YE PS SY',AF:'ZA NG KE GH EG MA DZ TN LY SD ET TZ UG ZM ZW MZ NA BW LS SZ RW BI DJ SO ER SS CM SN CI ML NE BF GN GW SL LR TG BJ TD CF CG CD GA GQ ST KM MG MU SC',SAS:'IN PK BD LK NP BT MV AF',EAP:'SG MY JP CN HK TW KR PH TH ID VN KH LA MM BN MN TL',OCE:'AU NZ FJ PG WS TO VU SB NC'};Object.keys(RG).forEach(k=>RG[k]=new Set(RG[k].split(' ')));const countryRegion=c=>Object.keys(RG).find(k=>RG[k].has(c))||null;
function openMenu(id){document.querySelectorAll('.multi').forEach(x=>x.id!==id&&x.classList.remove('open'));$('#'+id).classList.toggle('open')}
function makeOptions(id,items,kind){const m=$(id);m.innerHTML='<div class="menuhead"><b>Select '+(kind==='fn'?'functions':'levels')+'</b><span class="link" data-all>All</span></div>'+items.map(x=>'<label class="opt"><input type="checkbox" value="'+esc(x)+'" checked>'+esc(x)+'</label>').join('');m.querySelector('[data-all]').onclick=()=>{m.querySelectorAll('input').forEach(x=>x.checked=true);sync(kind)};m.querySelectorAll('input').forEach(x=>x.onchange=()=>sync(kind))}
function sync(k){const m=k==='fn'?$('#fnMenu'):$('#lvMenu'),v=[...m.querySelectorAll('input:checked')].map(x=>x.value);if(k==='fn'){selectedRoles=v;$('#fnText').textContent=v.length===m.querySelectorAll('input').length?'All functions':v.length+' selected'}else{selectedLevels=v;$('#lvText').textContent=v.length===m.querySelectorAll('input').length?'All levels':v.length+' selected'}}
function regions(){return '<option value="ALL">World</option>'+Object.entries(REGIONS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')}
function countries(prefer){const rg=$('#regionSel').value,list=META.countries.filter(c=>rg==='ALL'||countryRegion(c.code)===rg);$('#focusSel').innerHTML=list.map(c=>'<option value="'+c.code+'">'+c.flag+' '+esc(c.name)+'</option>').join('');if(list.some(c=>c.code===prefer))$('#focusSel').value=prefer}
function bars(a){if(!a.length)return '<div class="note">No matching data for the selected filters.</div>';const mx=Math.max(1,...a.map(x=>x.v));return a.map(x=>'<div class="barrow"><b>'+esc(x.l)+'</b><div class="bar"><i style="width:'+(x.v/mx*100)+'%"></i></div><b>'+money(x.v)+'</b></div>').join('')}
function matrix(m){if(!m)return '<div class="note">No focus-market band data is available for the selected country.</div>';return '<div class="heat" style="grid-template-columns:180px repeat('+m.levels.length+',1fr)"><div class="h">Function / Level</div>'+m.levels.map(x=>'<div class="h">'+esc(x)+'</div>').join('')+m.roles.map((r,i)=>'<div class="h">'+esc(r)+'</div>'+m.cells[i].map(v=>v==null?'<div class="v">—</div>':'<div class="'+(v>150?'v3':v>75?'v2':'v')+'">'+money(v)+'</div>').join('')).join('')+'</div>'}
function render(r){
$('#status').textContent='Submitted: '+(r.region==='ALL'?'World':REGIONS[r.region])+' · '+r.roles.length+' functions · '+r.levels.length+' levels'+(r.selected?' · Focus: '+r.selected.country.name:'');
$('#kpis').innerHTML='<div class="kpi"><small>MARKETS</small><b>'+r.ranked.length+'</b><span>with pay-band data in scope</span></div><div class="kpi"><small>MEDIAN PAY</small><b>'+money(r.median)+'</b><span>USD / year</span></div><div class="kpi"><small>TOP ÷ BOTTOM</small><b>'+r.spread+'×</b><span>market spread</span></div><div class="kpi"><small>EMPLOYER LOAD</small><b>'+pct(r.avgLoad)+'</b><span>avg. on gross</span></div><div class="kpi"><small>TAKE-HOME</small><b>'+pct(r.selected?r.selected.take:0)+'</b><span>of employer cost</span></div><div class="kpi"><small>FOCUS MARKET</small><b>'+(r.selectedRank>0?'#'+r.selectedRank:'—')+'</b><span>'+(r.selected?esc(r.selected.country.name):'No band data')+'</span></div>';
const market=r.ranked.slice(0,8).map(x=>({l:x.country.flag+' '+x.country.code,v:x.usd})),reg=r.regions.map(x=>({l:x.region,v:x.usd})),lev=r.ladder.map(x=>({l:x.level,v:x.usd})),load=[...r.ranked].sort((a,b)=>b.employerLoad-a.employerLoad).slice(0,6).map(x=>({l:x.country.flag+' '+x.country.code,v:x.employerLoad})),ranges=r.ranked.slice(0,6),heat=r.ranked.slice(0,12);
$('#grid').innerHTML='<div class="card two"><h3>Median compensation by market <span class="sub">USD / year · submitted filters</span></h3>'+bars(market)+'</div><div class="card one"><h3>Pay by region <span class="sub">median</span></h3>'+bars(reg)+'</div><div class="card half"><h3>Compensation by level <span class="sub">selected functions</span></h3>'+bars(lev)+'</div><div class="card half"><h3>Employer cost load <span class="sub">% of gross</span></h3>'+load.map(x=>'<div class="barrow"><b>'+esc(x.l)+'</b><div class="bar"><i style="width:'+x.v/Math.max(1,...load.map(y=>y.v))*100+'%"></i></div><b>'+pct(x.v)+'</b></div>').join('')+'</div><div class="card half"><h3>Function × designation compensation <span class="sub">'+(r.selected?esc(r.selected.country.name):'focus market')+' · USD median</span></h3>'+matrix(r.matrix)+'</div><div class="card half"><h3>Pay range by country <span class="sub">min · median · max</span></h3>'+ranges.map(x=>'<div class="barrow"><b>'+x.country.flag+' '+x.country.code+'</b><div class="bar"><i style="width:'+x.usd/Math.max(1,...ranges.map(y=>y.max))*100+'%"></i></div><b>$'+x.min+'–'+x.usd+'–'+x.max+'K</b></div>').join('')+'</div><div class="card full"><h3>Global market heatmap <span class="sub">median USD · selected functions and levels</span></h3><div class="heat" style="grid-template-columns:180px repeat(5,1fr)"><div class="h">Market</div><div class="h">Median</div><div class="h">Take-home</div><div class="h">Tax</div><div class="h">Employee social</div><div class="h">Employer load</div>'+heat.map(x=>'<div class="h">'+x.country.flag+' '+esc(x.country.name)+'</div><div class="'+(x.usd>120?'v3':x.usd>70?'v2':'v')+'">$'+x.usd+'K</div><div class="v">'+x.take+'%</div><div class="v">'+x.tax+'%</div><div class="v">'+x.contrib+'%</div><div class="v">'+x.employerLoad+'%</div>').join('')+'</div><div class="legend">'+esc(r.note)+'</div></div>';
}
async function submit(){try{$('#submitBtn').disabled=true;$('#submitBtn').textContent='Loading…';render(await parent.gciDashboard({region:$('#regionSel').value,roles:selectedRoles,levels:selectedLevels,country:$('#focusSel').value}))}catch(e){$('#status').textContent='Dashboard error: '+e.message}finally{$('#submitBtn').disabled=false;$('#submitBtn').textContent='Submit'}}
async function init(){META=await parent.gciMeta();$('#regionSel').innerHTML=regions();makeOptions('#fnMenu',META.roles,'fn');makeOptions('#lvMenu',META.levels,'lv');sync('fn');sync('lv');countries('IN');$('#regionSel').onchange=()=>countries();$('#fnSelect').onclick=()=>openMenu('fn');$('#lvSelect').onclick=()=>openMenu('lv');$('#submitBtn').onclick=submit;$('#clearBtn').onclick=()=>{$('#regionSel').value='ALL';$('#fnMenu').querySelectorAll('input').forEach(x=>x.checked=true);$('#lvMenu input').forEach(x=>x.checked=true);sync('fn');sync('lv');countries('IN');submit()};document.addEventListener('click',e=>{if(!e.target.closest('.multi'))document.querySelectorAll('.multi').forEach(x=>x.classList.remove('open'))});await submit()}
init();
})();
</script>
</body></html>
